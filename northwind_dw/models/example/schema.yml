version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: dim_products
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: dim_employees
    columns:
      - name: employee_id
        tests:
          - not_null
          - unique

  - name: dim_date
    columns:
      - name: id
        tests:
          - not_null
          - unique

  - name: fact_sales
    columns:
      - name: order_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id